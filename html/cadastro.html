<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas Amigas - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="cabecalho">
        <h1>Cadastro de apoiadores</h1>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section class="secao">
            <h2>Faça parte da Patas Amigas</h2>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>

                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <br><br>

                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>

                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        required
                    >

                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        required
                    >
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>

                    <br><br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>

                    <br><br>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PR">Paraná</option>
                    </select>

                    <br><br>

                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="[0-9]{5}-[0-9]{3}"
                        required
                    >
                </fieldset>

                <fieldset>
                    <legend>Como deseja ajudar?</legend>

                <div class="opcao">
                    <input
                        type="radio"
                        id="voluntario"
                        name="ajuda"
                        value="voluntario"
                        required
                    >
                    <label for="voluntario">Quero ser voluntário</label>
                </div>

                    
                
                <div class="opcao">    
                    <input
                        type="radio"
                        id="doador"
                        name="ajuda"
                        value="doador"
                    >
                    <label for="doador">Quero fazer doações</label>
                </div>

                </fieldset>

                <br>

                <div class="alerta informacao">
                    Preencha os dados para realizar seu cadastro.
                </div>    

                <button type="submit" class="botao">Enviar cadastro</button>
                
                <div class="modal-exemplo">
                    <div class="modal">
                        <span class="modal-fechar">×</span>
                        <div class="modal-icone">✓</div>

                        <h3>Cadastro realizado!</h3>

                        <p>
                            Obrigado por apoiar a ONG Patas Amigas.
                        </p>
                    </div>
                </div>            

            </form>
        </section>
    </main>

    <footer>
        <p>ONG Patas Amigas - contato@patasamigas.org</p>
    </footer>
</body>
</html>
